[workspace]
members = [
    "crates/cli",
    "crates/cloud-sync",
    "crates/common",
    "crates/screen-capture",
    "crates/clipboard",
    "crates/config",
    "crates/core",
    "crates/daemon",
    "crates/diagnostics",
    "crates/filetransfer",
    "crates/input",
    "crates/input-recorder",
    "crates/network",
    "crates/platform-linux",
    "crates/platform-mac",
    "crates/platform-wayland",
    "crates/platform-win",
    "crates/platform-x11",
    "crates/plugin-runtime",
    "crates/protocol",
    "crates/peripherals",
    "crates/relay-server",
    "crates/workspace",
    "crates/remap",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/hyprbridge/hyprbridge"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["macros", "ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.38", features = ["derive", "env", "wrap_help"] }
directories = "6.0.0"
ed25519-dalek = { version = "2.1.1", features = ["rand_core", "serde"] }
evdev = "0.13.2"
futures-util = "0.3.31"
hex = "0.4.3"
http = "1.3.1"
mdns-sd = "0.13.8"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8.5"
rcgen = "0.13.2"
reqwest = { version = "0.12.15", default-features = false, features = ["http2", "json", "rustls-tls"] }
rustls = "0.23.37"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
toml = "0.8.22"
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
tempfile = "3"
uuid = { version = "1.17.0", features = ["serde", "v4"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
