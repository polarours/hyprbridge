name: Bug report
description: Report a reproducible problem in HyprBridge.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, session type, version, and reproduction details
    validations:
      required: true
